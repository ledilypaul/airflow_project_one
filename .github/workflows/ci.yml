name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # P3-4 : une CVE publiée après le dernier push est détectée sans attendre le
  # suivant. Le lundi (cron en UTC, branche par défaut) ; seuls les jobs de
  # sécurité tournent alors, `test` est ignoré (voir sa condition).
  schedule:
    - cron: "17 5 * * 1"

# P3-4 : le GITHUB_TOKEN du workflow est en lecture seule sur le dépôt. Un job qui
# a besoin de plus le déclare lui-même, au niveau du job (jamais ici).
permissions:
  contents: read

jobs:
  test:
    name: Lint, tests & DAG import check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      # Lancé avant `uv sync` : `uv sync` sans `--locked`/`--frozen` régénère
      # silencieusement un uv.lock périmé, ce qui masquerait une incohérence
      # avec pyproject.toml. On vérifie donc le lock tel que committé d'abord.
      - name: Check that uv.lock is up to date with pyproject.toml
        run: uv lock --check

      # P2-4 : transform/ est un projet uv séparé (dbt n'est pas installé à
      # côté d'Airflow), avec son propre uv.lock, vérifié de la même façon.
      - name: Check that transform/uv.lock is up to date with transform/pyproject.toml
        run: uv --directory transform lock --check

      - name: Install dependencies (runtime + airflow + dev groups)
        run: uv sync

      # P5-4 : avant `make dbt-parse`, qui réécrirait les modèles générés.
      - name: Check that the generated dbt staging layer is up to date
        run: .venv/bin/python scripts/generate_dbt_staging.py --check

      # transform_dag est rendu depuis transform/target/manifest.json
      # (LoadMode.DBT_MANIFEST) : sans lui, son import échoue et
      # test_no_import_errors aussi. `make dbt-parse` synchronise
      # transform/.venv (--locked) puis lance `dbt parse`.
      - name: Install dbt (transform/) and generate the dbt manifest
        run: make dbt-parse

      # P2-5 : jar du listener OpenLineage Spark (version et SHA-256 épinglés
      # dans le Makefile), mis en cache entre les runs : Maven Central n'est
      # sollicité que quand la version ou l'empreinte change. `make lineage-jar`
      # revérifie le SHA-256 du jar restauré, et le retélécharge s'il diffère.
      # La clé contient la version ET l'empreinte épinglée
      # (OPENLINEAGE_SPARK_SHA256) : changer l'une ou l'autre invalide le cache.
      - name: Read the pinned OpenLineage Spark version and SHA-256
        id: openlineage
        run: |
          echo "version=$(sed -n 's/^OPENLINEAGE_SPARK_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sed -n 's/^OPENLINEAGE_SPARK_SHA256 := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Cache the OpenLineage Spark jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lineage/jars
          key: openlineage-spark_2.13-${{ steps.openlineage.outputs.version }}-${{ steps.openlineage.outputs.sha256 }}

      - name: Download the OpenLineage Spark jar (checked by SHA-256)
        run: make lineage-jar

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # tests/unit/dags/test_dags.py::test_no_import_errors charge tous les
      # DAGs via DagBag et vérifie dagbag.import_errors == {} ; c'est la
      # vérification "chargement des DAGs sans erreur d'import" demandée par
      # P0-5, pas besoin d'une étape dédiée en plus de la suite pytest.
      # REQUIRE_DBT=1 : les tests dbt réels (tests/integration/test_p2_4_dbt_build.py)
      # échouent au lieu d'être ignorés si transform/.venv manquait.
      # REQUIRE_LINEAGE=1 (P2-5) : de même pour le vrai job Spark avec son
      # listener OpenLineage (tests/integration/test_p2_5_spark_lineage.py)
      # si le jar manquait.
      - name: Run test suite (includes DAG import check, real dbt builds and Spark lineage)
        run: uv run pytest tests/ -q
        env:
          REQUIRE_DBT: "1"
          REQUIRE_LINEAGE: "1"
          AIRFLOW__COSMOS__ENABLE_TELEMETRY: "False"

  # P5-8 : le moteur Polars sans Spark ni Airflow. Seules les dépendances du cœur
  # (`--no-default-groups`) : ni PySpark, ni pyspark-client, ni Airflow. `--no-build`
  # refuse de construire quoi que ce soit (tout le cœur existe en wheels) ; le projet
  # n'est donc pas installé, le dépôt est sur PYTHONPATH. Puis le vrai job Polars sur
  # les fichiers d'exemple (tests/unit/engine/test_p5_8_polars_only.py, sans pytest).
  polars-only:
    name: Polars engine without PySpark nor Airflow
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: .venv-core
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install the core dependencies only
        run: uv sync --locked --no-default-groups --no-build --no-install-project

      - name: Check that neither Spark nor Airflow is installed
        run: |
          .venv-core/bin/python -c "
          import importlib.metadata as m, sys
          names = {d.metadata['Name'].lower() for d in m.distributions()}
          unexpected = sorted(names & {'pyspark', 'pyspark-client', 'apache-airflow', 'pandas'})
          sys.exit(f'unexpected distributions: {unexpected}' if unexpected else 0)
          "

      - name: Run the Polars job on the example files
        run: .venv-core/bin/python tests/unit/engine/test_p5_8_polars_only.py

  # P3-4 : audit des dépendances Python figées (uv.lock de la racine ET de transform/).
  # Bloquant : le lock actuel n'a aucune CVE connue (vérifié le 2026-11-15), tout
  # constat futur doit donc être vu. Une CVE sans correctif disponible se traite
  # explicitement, avec `--ignore-vuln <ID>` et un commentaire qui dit pourquoi et
  # jusqu'à quand, pas en désactivant l'étape.
  # `--no-deps --disable-pip` : les exports sont déjà entièrement résolus, pip-audit
  # n'a ni à résoudre ni à installer quoi que ce soit (rapide, sans exécuter de code).
  # La version de pip-audit est épinglée ici (Dependabot ne la suit pas) : l'outil
  # interroge la base de vulnérabilités en direct, une version un peu ancienne
  # n'affaiblit donc pas le contrôle.
  pip-audit:
    name: pip-audit (uv.lock racine et transform/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      # --frozen : exporte le lock tel que committé, sans le régénérer (la cohérence
      # lock/pyproject est vérifiée par le job `test`). Sans --no-dev : les groupes
      # airflow et dev sont audités aussi.
      - name: Export the locked requirements
        run: |
          uv export --frozen --no-hashes --no-emit-project --group docs -o "$RUNNER_TEMP/requirements-root.txt"
          uv --directory transform export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements-transform.txt"

      - name: pip-audit (root project)
        run: uvx --from "pip-audit==2.10.1" pip-audit -r "$RUNNER_TEMP/requirements-root.txt" --no-deps --disable-pip --progress-spinner off

      - name: pip-audit (transform/)
        run: uvx --from "pip-audit==2.10.1" pip-audit -r "$RUNNER_TEMP/requirements-transform.txt" --no-deps --disable-pip --progress-spinner off

  # Documentation Sphinx (docs/) : un avertissement est une erreur, comme `make docs`. Le groupe
  # `docs` de uv.lock seul est installé (`--only-group`) : l'analyse du code est statique
  # (sphinx-autodoc2), ni PySpark ni Airflow ne sont nécessaires. Ignoré sur le cron du lundi,
  # réservé aux jobs de sécurité.
  docs:
    name: Documentation (Sphinx, warnings are errors)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build the documentation
        run: make docs

  # P3-4 : Trivy, système de fichiers : CVE des lockfiles (uv.lock des deux projets),
  # secrets et mauvaises configurations. Il n'existe pas de contrôle Trivy intégré pour
  # docker-compose.yaml : le fichier est couvert par la détection de secrets, pas par la
  # détection de mauvaises configurations (Dockerfile, Kubernetes, Terraform...).
  #
  # BLOQUANT (exit-code "1") depuis le 2026-11-21 : le rapport du run du push 185a374 sur
  # develop (Trivy v0.70.0) ne contient aucun constat : 0 vulnérabilité dans uv.lock et
  # transform/uv.lock, 0 secret, 0 mauvaise configuration dans le Dockerfile. Seuil explicite :
  # HIGH et CRITICAL avec un correctif disponible (`ignore-unfixed`). Un constat futur
  # se traite : corriger, ou l'ignorer dans .trivyignore avec un commentaire qui dit
  # pourquoi et jusqu'à quand (jamais en repassant exit-code à "0").
  # Limites connues du rapport : le chart Helm du projet (deploy/k8s/charts/project) n'est pas
  # rendu par Trivy (il exige `--set-file fileListSql=...`), donc pas analysé ; les
  # dépendances de développement des lockfiles sont ignorées par Trivy (pip-audit les couvre) ;
  # les images du compose ont leur propre job (`trivy-images`, rapport seul).
  # Trivy est épinglé à v0.70.0, postérieur à l'incident de mars 2026 (CVE-2026-33634 :
  # trivy-action et setup-trivy détournés, binaire 0.69.4 malveillant). L'action
  # elle-même est épinglée par SHA de commit ; v0.36.0 épingle setup-trivy par SHA.
  trivy:
    name: Trivy (lockfiles, secrets, configuration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0
          format: table

  # Trivy sur les images de docker-compose.yaml (reste de P3-4), RAPPORT SEUL : le scan
  # du 2026-11-22 (Trivy v0.70.0, HIGH et CRITICAL avec correctif) trouve 171 constats dans
  # marquez-web, 33 dans marquez, 27 dans chacun des deux postgres (17.12 et 14, paquets
  # Debian et stdlib Go de gosu), 4 dans prometheus, 0 dans le collecteur OTel et redis.
  # Un scan bloquant échouerait donc dès le premier run ; ces images ne servent qu'au
  # développement local (ports sur 127.0.0.1). Chaque image est scannée, l'effectif est
  # annoncé par un `::warning::` et le tableau est dans le journal. Passer en bloquant se
  # décide image par image, après tri (mise à jour de l'image, ou .trivyignore daté).
  # Une erreur du scan lui-même (réseau, base de vulnérabilités) fait en revanche échouer
  # le job. La liste des images est lue dans le compose : rien à tenir à jour ici.
  # Trivy tourne par son image officielle, épinglée par digest (pas d'action tierce de plus).
  trivy-images:
    name: Trivy (images of docker-compose.yaml, report only)
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan every image of docker-compose.yaml
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          sed -n 's/^[[:space:]]*image:[[:space:]]*//p' docker-compose.yaml | sort -u > "$RUNNER_TEMP/images.txt"
          test -s "$RUNNER_TEMP/images.txt"
          while read -r image; do
            scan() {
              docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache" "$TRIVY_IMAGE" \
                image --quiet --severity HIGH,CRITICAL --ignore-unfixed "$@" "$image"
            }
            echo "::group::$image"
            scan --format table
            scan --format json > "$RUNNER_TEMP/report.json"
            echo "::endgroup::"
            count=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(sum(len(r.get("Vulnerabilities") or []) for r in d.get("Results") or []))' "$RUNNER_TEMP/report.json")
            if [ "$count" -gt 0 ]; then
              echo "::warning title=Trivy image::$image : $count HIGH/CRITICAL avec correctif (rapport seul, voir le journal)"
            fi
          done < "$RUNNER_TEMP/images.txt"

  # P3-4 : gitleaks sur l'historique git (fetch-depth: 0). Bloquant. Les constats déjà
  # présents dans l'historique sont listés, un par un, dans .gitleaksignore avec leur
  # origine : on n'abaisse ni la sensibilité ni le périmètre.
  # Dépôt personnel : pas de GITLEAKS_LICENSE. Si le dépôt passe dans une
  # organisation, l'action en exige une (secret `GITLEAKS_LICENSE`).
  # `pull-requests: read` : l'action liste les commits de la PR ; les commentaires sur
  # la PR sont désactivés (ils demanderaient `pull-requests: write`).
  gitleaks:
    name: gitleaks (secrets in git history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
