# Défaut par extension (P2-1) : utilisé quand aucune config de
# config/sources/ ne correspond au fichier. Modèle : pipeline/config/models.py.
source:
  name: default_xlsx
  format: xlsx
  patterns: ["*.xlsx"]

reader:
  # Options de pyspark.pandas.read_excel (pandas), pas des options Spark.
  options:
    # Index 0-based de la ligne d'en-tête : 1 sauterait la première ligne de données (C-NEW1).
    header: 0
    dtype: str

# Zone raw seulement (P2-2) : un fichier sans config dédiée est conservé tel
# qu'il a été lu, rien n'est perdu en silence. Pas de zone staging : aucun
# contrat de schéma, des fichiers sans rapport partagent cette table (une
# partition (lake_run_id, lake_source_file) par run et par fichier ; une
# lecture globale demande mergeSchema). Un instantané par listing ; état
# courant : latest_snapshot (storage/parquet_lake_writer.py).
storage:
  table_name: default_xlsx
  format: parquet
  mode: overwrite
  raw_path: "raw/"
