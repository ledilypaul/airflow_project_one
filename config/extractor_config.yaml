extractor_config:
  source_directories:
    # Mettre ici les chemins absolus (ou relatifs au dossier de lancement) vers vos données.
    # Exemple local : "/home/user/data/" ou "./data/"
    - "./data/"

  files_extensions:
    - ".csv"
    # - '.json'
    - ".parquet"
    - ".xlsx"
  include_files:
    # Tous les fichiers des extensions ci-dessus : la config de lecture
    # (config/sources/*.yaml, sinon les défauts par extension) est choisie
    # ensuite par `source.patterns`.
    - "*"
  exclude_files:
    - "file1_*.csv"
    - "*file2_*.csv"
