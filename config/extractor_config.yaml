extractor_config:
  source_directories:
    # Mettre ici les chemins absolus (ou relatifs au dossier de lancement) vers vos données.
    # Exemple local : "/home/user/data/" ou "./data/"
    - "./data/"

  files_extensions:
    - ".csv"
    # - '.json'
    - ".parquet"
    - ".xlsx"
  include_files:
    - "*IMDB*"
    - "*creditcard*"
    - "*person*"
    # - "**"
    - "orders_*"
  exclude_files:
    - "file1_*.csv"
    - "*file2_*.csv"
