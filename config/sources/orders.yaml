# Config de lecture dédiée (P2-1). Modèle : pipeline/config/models.py.
source:
  name: orders
  format: csv
  # Motifs fnmatch sur le nom du fichier, insensibles à la casse
  # (repris de extractor_config.yaml : include_files "orders_*"). Limité aux
  # .csv, comme le format déclaré ci-dessus.
  patterns: ["orders_*.csv"]

reader:
  # Options Spark CSV, passées telles quelles (liste blanche :
  # pipeline/config/reader_options.py).
  options:
    header: true
    delimiter: ","
    encoding: "UTF-8"
    # P2-6 : le schéma ci-dessous est positionnel. Avec enforceSchema: false,
    # Spark compare l'en-tête de chaque fichier aux noms déclarés (nombre et
    # noms, casse ignorée) et échoue sur un écart : un fichier de commandes
    # d'un autre format est `failed` au lieu d'être lu avec des colonnes
    # décalées ou nulles. inferSchema est retiré : sans effet avec un schéma.
    enforceSchema: false
  # Schéma explicite (P2-6), dans l'ordre des colonnes du fichier, relevé sur
  # data/orders_sample.csv (en-tête order_id,customer,amount,order_date).
  # Types : pipeline/config/types.py. amount en double (pas de decimal dans
  # les types acceptés ; float perdrait des centimes). Même schéma que la
  # source dbt lake_staging.orders et le contrat de stg_orders__current.
  columns_type:
    order_id: int
    customer: string
    amount: double
    order_date: date

# Écriture (P2-2), sous LAKE_ROOT : <raw_path><table>/ reçoit le fichier tel
# qu'il a été lu, <staging_path><table>/ le même après retrait des lignes
# entièrement vides et des doublons exacts. Sans staging_path : raw seulement.
# Aucune table ne peut être imbriquée dans une autre (raw/staging de cette
# source ou tables des autres configs), casse ignorée.
# Partitions (lake_run_id, lake_source_file), réécrites à l'identique par un
# retry. Un instantané par listing : chaque listing réécrit le fichier sous
# son propre lake_run_id. État courant d'une table : pour chaque
# lake_source_file, la partition du plus grand lake_file_id (= file_list.id,
# le listing le plus récent), voir latest_snapshot dans
# storage/parquet_lake_writer.py. Pas « la dernière écriture gagne » :
# relancer un ancien run réécrit sa partition sans la rendre courante.
storage:
  table_name: orders
  format: parquet
  mode: overwrite
  raw_path: "raw/"
  staging_path: "staging/"

# Contrôles qualité (P2-3, modèle : pipeline/config/quality.py), tous en
# avertissement (staging écrit quand même) : seuls l'identifiant de commande
# (P2-6, une commande par order_id dans un fichier) et le fichier vide sont
# contrôlés, aucune règle métier n'est supposée (un montant négatif peut être
# un avoir). À passer en error une fois les résultats de quality/orders
# vérifiés sur de vrais fichiers. Résultats : <LAKE_ROOT>/quality/orders/.
quality:
  checks:
    - type: not_null
      column: order_id
      severity: warn
    - type: unique
      columns: [order_id]
      severity: warn
    - type: row_count
      min: 1
      severity: warn
