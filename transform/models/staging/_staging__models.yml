version: 2

# Tests limités aux colonnes techniques, garanties par le job Spark : aucune
# règle métier n'est supposée (les contrôles métier relèvent de quality:, P2-3).
models:
  - name: stg_movies__current
    description: >-
      État courant de staging/movies (latest_snapshot) : un seul instantané par
      fichier source. lake_ingested_at : TIMESTAMP sans fuseau, en UTC.
    # Contrat appliqué (C-3) : union_by_name prend, pour chaque colonne, le type
    # le plus large de TOUS les instantanés, anciens compris. Un type élargi ou
    # une colonne en plus fait échouer le build au lieu de changer le schéma de
    # l'entrepôt en silence. Mêmes colonnes et types que la source movies
    # (reader.columns_type d'imdb.yaml + colonnes techniques), vérifié par pytest.
    config:
      contract:
        enforced: true
    data_tests:
      - one_snapshot_per_source_file
    columns:
      - {name: id, data_type: INTEGER}
      - {name: title, data_type: VARCHAR}
      - {name: vote_average, data_type: FLOAT}
      - {name: vote_count, data_type: INTEGER}
      - {name: status, data_type: VARCHAR}
      - {name: release_date, data_type: DATE}
      - {name: revenue, data_type: FLOAT}
      - {name: runtime, data_type: INTEGER}
      - {name: adult, data_type: BOOLEAN}
      - {name: backdrop_path, data_type: VARCHAR}
      - {name: budget, data_type: INTEGER}
      - {name: homepage, data_type: VARCHAR}
      - {name: imdb_db, data_type: VARCHAR}
      - {name: original_language, data_type: VARCHAR}
      - {name: original_title, data_type: VARCHAR}
      - {name: overview, data_type: VARCHAR}
      - {name: popularity, data_type: FLOAT}
      - {name: poster_path, data_type: VARCHAR}
      - {name: tagline, data_type: VARCHAR}
      - {name: production_companies, data_type: VARCHAR}
      - {name: production_countries, data_type: VARCHAR}
      - {name: spoken_languages, data_type: VARCHAR}
      - {name: keywords, data_type: VARCHAR}
      - {name: release_year, data_type: INTEGER}
      - {name: Director, data_type: VARCHAR}
      - {name: AverageRating, data_type: FLOAT}
      - {name: Poster_Link, data_type: VARCHAR}
      - {name: Certificate, data_type: VARCHAR}
      - {name: IMDB_Rating, data_type: FLOAT}
      - {name: Metascore, data_type: FLOAT}
      - {name: Star1, data_type: VARCHAR}
      - {name: Star2, data_type: VARCHAR}
      - {name: Star3, data_type: VARCHAR}
      - {name: Star4, data_type: VARCHAR}
      - {name: Writer, data_type: VARCHAR}
      - {name: Director_of_Photography, data_type: VARCHAR}
      - {name: Producer, data_type: VARCHAR}
      - {name: Music_Composer, data_type: VARCHAR}
      - {name: genre_list, data_type: VARCHAR}
      - {name: Cast_list, data_type: VARCHAR}
      - {name: overview_sentiment, data_type: VARCHAR}
      - {name: all_combined_keywords, data_type: VARCHAR}
      - {name: lake_file_id, data_type: BIGINT, data_tests: [not_null]}
      - {name: lake_ingested_at, data_type: TIMESTAMP, data_tests: [not_null]}
      - {name: lake_run_id, data_type: VARCHAR, data_tests: [not_null]}
      - {name: lake_source_file, data_type: VARCHAR, data_tests: [not_null]}
  - name: stg_orders__current
    description: >-
      État courant de staging/orders (latest_snapshot) : un seul instantané par
      fichier source. lake_ingested_at : TIMESTAMP sans fuseau, en UTC.
    # Contrat appliqué (P2-6), même raison que stg_movies__current : mêmes
    # colonnes et types que la source orders (reader.columns_type d'orders.yaml
    # + colonnes techniques), vérifié par pytest.
    config:
      contract:
        enforced: true
    data_tests:
      - one_snapshot_per_source_file
    columns:
      - {name: order_id, data_type: INTEGER}
      - {name: customer, data_type: VARCHAR}
      - {name: amount, data_type: DOUBLE}
      - {name: order_date, data_type: DATE}
      - {name: lake_file_id, data_type: BIGINT, data_tests: [not_null]}
      - {name: lake_ingested_at, data_type: TIMESTAMP, data_tests: [not_null]}
      - {name: lake_run_id, data_type: VARCHAR, data_tests: [not_null]}
      - {name: lake_source_file, data_type: VARCHAR, data_tests: [not_null]}
