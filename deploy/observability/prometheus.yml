# P3-3: local Prometheus, optional (compose profile `observability`).
# It scrapes the collector's Prometheus exporter (compose network only) and
# evaluates the alert rules of rules/. No Alertmanager: the alerts are read in
# the UI (http://127.0.0.1:9092/alerts), see docs/architecture.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    # The collector exposes, for every series, the `job` (OTEL_SERVICE_NAME)
    # and `instance` (one per Airflow process) of the OpenTelemetry resource:
    # keep them instead of renaming them `exported_job` / `exported_instance`.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
