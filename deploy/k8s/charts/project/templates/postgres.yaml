{{- /*
Dev Postgres (P3-2): one server, two databases.
- `airflow`: Airflow's metadata DB (data.metadataSecretName of the Airflow chart).
- `file_list`: the pipeline's table, owned by its own role.
Passwords come from Secrets created by scripts/k8s_secrets.py; the init script
passes them to psql as variables (:'name' quoting), never interpolated in SQL.
The init scripts run only when the data directory is created: an existing PVC
keeps the roles and passwords of its first start (as the docker-compose volume).
The PVC of the StatefulSet survives `helm uninstall` (`make kind-down` removes it).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgres.serviceName }}-init
  labels:
    {{- include "project.labels" . | nindent 4 }}
data:
  10-roles-and-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v airflow_password="$AIRFLOW_DB_PASSWORD" \
      -v file_list_password="$FILE_LIST_DB_PASSWORD" <<'SQL'
    CREATE ROLE airflow LOGIN PASSWORD :'airflow_password';
    CREATE DATABASE airflow OWNER airflow;
    CREATE ROLE {{ .Values.fileListDb.user }} LOGIN PASSWORD :'file_list_password';
    CREATE DATABASE {{ .Values.fileListDb.name }} OWNER {{ .Values.fileListDb.user }};
    REVOKE ALL ON DATABASE airflow FROM PUBLIC;
    REVOKE ALL ON DATABASE {{ .Values.fileListDb.name }} FROM PUBLIC;
    SQL
    # file_list is created by its owner (local socket of the init server).
    psql -v ON_ERROR_STOP=1 --username {{ .Values.fileListDb.user }} \
      --dbname {{ .Values.fileListDb.name }} -f /docker-entrypoint-initdb.d/20-file-list.sql.in
  20-file-list.sql.in: |
    {{- required "fileListSql is required: helm ... --set-file fileListSql=utils/SQL/script_tables.sql" .Values.fileListSql | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.serviceName }}
  labels:
    {{- include "project.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: airflow-project-one
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: {{ .Values.fileListDb.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgres.serviceName }}
  labels:
    {{- include "project.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: {{ .Values.postgres.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: airflow-project-one
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "project.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid/gid of the `postgres` user of the official image.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "project.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: postgres-password
            - name: AIRFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: airflow-password
            - name: FILE_LIST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fileListDb.secretName }}
                  key: {{ .Values.fileListDb.secretKey }}
            # A subdirectory of the volume: initdb refuses a non-empty mount point.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "--username", "postgres", "--host", "127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "--username", "postgres", "--host", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: init
          configMap:
            name: {{ .Values.postgres.serviceName }}-init
            defaultMode: 0555
        - name: run
          emptyDir: {}
  # Immutable once created: stable labels only (no chart version), or every
  # upgrade of this chart would be refused (C-2).
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "project.stableLabels" . | nindent 10 }}
          app.kubernetes.io/name: postgres
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
