{{- /*
SEC-2: what the pods created by the Spark driver (ServiceAccount `spark`) and by
spark-submit in the worker pods (`airflow-worker`) may be. Their Roles allow
pods:create, which by itself would let a compromised task start a pod that
mounts or reads any Secret of the namespace. Each pod they create must:
- run as the ServiceAccount `spark`;
- use the project image only (every container, init and ephemeral included);
- mount no Secret (volume, or projected source);
- read no Secret through env/envFrom, except the file_list password
  (spark.kubernetes.driver.secretKeyRef.DB_PASSWORD).
Cluster-scoped objects (ValidatingAdmissionPolicy is GA since Kubernetes 1.30),
bound to this namespace only. Checked on kind: a pod created as airflow-worker
with a Secret volume is denied; the real runs pass.
*/ -}}
{{- if .Values.admissionPolicy.enabled }}
{{- $ns := .Release.Namespace }}
{{- $image := include "project.image" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $ns }}-spark-pods
  labels:
    {{- include "project.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: created-by-spark-or-spark-submit
      expression: >-
        request.userInfo.username in [
        'system:serviceaccount:{{ $ns }}:{{ .Values.spark.serviceAccountName }}',
        'system:serviceaccount:{{ $ns }}:{{ .Values.spark.submitterServiceAccountName }}']
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        has(object.spec.serviceAccountName)
        && object.spec.serviceAccountName == '{{ .Values.spark.serviceAccountName }}'
      message: "pods created by Spark must run as the ServiceAccount {{ .Values.spark.serviceAccountName }}"
    - expression: >-
        variables.containers.all(c, c.image == '{{ $image }}'
        || c.image == 'docker.io/library/{{ $image }}')
      message: "pods created by Spark must use the project image {{ $image }}"
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.secret)
        && (!has(v.projected) || !has(v.projected.sources)
        || v.projected.sources.all(s, !has(s.secret))))
      message: "pods created by Spark must not mount a Secret"
    - expression: >-
        variables.containers.all(c, !has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef)))
      message: "pods created by Spark must not load a Secret with envFrom"
    - expression: >-
        variables.containers.all(c, !has(c.env) || c.env.all(e,
        !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef)
        || e.valueFrom.secretKeyRef.name == '{{ .Values.fileListDb.secretName }}'))
      message: "pods created by Spark may only read the Secret {{ .Values.fileListDb.secretName }}"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $ns }}-spark-pods
  labels:
    {{- include "project.labels" . | nindent 4 }}
spec:
  policyName: {{ $ns }}-spark-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns }}
{{- end }}
